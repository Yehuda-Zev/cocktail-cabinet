<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Breakout — The Cocktail Cabinet</title>
<link rel="stylesheet" href="../../shared/css/game.css" />
</head>
<body class="game-page">

  <div class="game-header">
    <a class="back-link" href="../../">&larr; Cabinet</a>
    <h1>Breakout</h1>
    <span style="width:4.5rem"></span>
  </div>

  <div id="role-assignment"></div>

  <div class="game-hud">
    <span>Bottom: <strong id="hud-score-bottom">0</strong></span>
    <span>Top: <strong id="hud-score-top">0</strong></span>
    <span>Ball Speed: <strong id="hud-speed">–</strong></span>
    <span>Status: <strong id="hud-status">Ready</strong></span>
  </div>

  <div class="game-canvas-frame">
    <canvas id="game-canvas"></canvas>
  </div>

  <div class="game-controls">
    <button class="game-btn" id="btn-start">Start</button>
    <button class="game-btn" id="btn-restart">Restart</button>
  </div>

  <p class="game-note">
    Bottom paddle: Arrow Left / Arrow Right. Top paddle: A / D. First to 7 points wins.
    Assign either paddle to Human or Computer above — same paddle, same physics, either side.
  </p>

  <script type="module" src="breakout.js"></script>
</body>
</html>
